<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>gRPC-Web + Leptos Example</title>
    <script type="module">
        import init from './example_client.js';
        
        async function run() {
            console.log('Starting WASM initialization...');
            try {
                await init();
                console.log('WASM initialized');
            } catch (e) {
                console.error('Error:', e);
            }
        }
        
        run().catch(console.error);
    </script>
</head>
<body>
    <div id="app"></div>
</body>
</html>
