[package]
name = "example-client"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
example-common = { path = "../common" }
grpc-web-rust = { path = "../.." }
leptos = "0.6"
tokio = { version = "1", features = ["macros"] }
prost = "0.13"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "Window",
    "Document",
    "Element",
    "HtmlElement",
    "Node",
    "console",
] }
js-sys = "0.3"
anyhow = "1"

[build-dependencies]

[profile.release]
opt-level = "s"
lto = true
