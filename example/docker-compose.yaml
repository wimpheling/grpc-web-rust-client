services:
  envoy:
    image: envoyproxy/envoy:v1.29.0
    ports:
      - "8081:8080"
      - "9901:9901"
    volumes:
      - ./envoy.yaml:/etc/envoy/envoy.yaml
    depends_on:
      - server

  server:
    build:
      context: ..
      dockerfile: example/server/Dockerfile
    ports:
      - "50051:50051"

  frontend:
    build:
      context: ..
      dockerfile: example/client/Dockerfile
    ports:
      - "8082:80"
    depends_on:
      - envoy
